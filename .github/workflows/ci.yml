name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # Style options are in .flake8 at the repo root.
        # Only E999 (syntax), W605 (bad escapes) and F821 (undefined names)
        # are enforced during the initial port; everything else is suppressed
        # until incremental style cleanup PRs are merged.
        run: flake8 . --count --statistics

  import-test:
    name: Import test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt5 needs a virtual display on headless Linux runners
      - name: Install virtual display (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            xvfb x11-utils libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libxcb-xfixes0

      - name: Install pyquant4d (no GPU extras)
        run: pip install -e .

      - name: Verify core imports (Linux — with Xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python - <<'EOF'
          import callbacks.appClass
          import callbacks.allFunctions
          import annotationsClasses.interactiveAnnulus
          print("Core imports OK")
          EOF

      - name: Verify core imports (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "
          import callbacks.appClass
          import callbacks.allFunctions
          import annotationsClasses.interactiveAnnulus
          print('Core imports OK')
          "

      - name: Check entry point exists
        run: python -c "import Quant4D_app; print('Entry point module OK')"
