# .readthedocs.yaml
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for options

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - libgl1
    - libglib2.0-0

# Build the docs with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Install the package so autodoc can import the modules
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
    - requirements: docs/requirements.txt
    
